    id="assessment"
    ${s==='locked'?'disabled':''}>
    ${s==='locked'
        ? '🔒 LOCKED'
        : '📝 TAKE ASSESSMENT'}
</button>

<div class="section"><strong>LEARNING PROGRESS</strong><div class="progress"><i style="width:${state[n.id]?'100':'0'}%"></i></div></div>`;
const learnBtn=details.querySelector('#learn');
if(learnBtn && s!=='locked') learnBtn.addEventListener('click',()=>window.open(n.learn,'_blank','noopener,noreferrer'));
const assessmentButton =
    details.querySelector('#assessment');

if(assessmentButton && s !== 'locked'){

    assessmentButton.addEventListener(
        'click',
        ()=>startAssessment(n.id)
    );

}
}
function updateStats(){let d=nodes.filter(n=>state[n.id]).length;document.getElementById('done').textContent=d;document.getElementById('xp').textContent=nodes.filter(n=>state[n.id]).reduce((a,n)=>a+n.xp,0);document.getElementById('pct').textContent=Math.round(d/nodes.length*100)+'%'}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));draw()}));
document.getElementById('profile').addEventListener('click',()=>window.open('https://learn.microsoft.com/users/me/achievements','_blank','noopener,noreferrer'));
document.getElementById('reset').addEventListener('click',()=>{state=Object.fromEntries(nodes.map(n=>[n.id,false]));selected='ai101';draw()});
let dragging=false,lx=0,ly=0;const vp=document.getElementById('viewport');
vp.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;dragging=true;lx=e.clientX;ly=e.clientY;vp.setPointerCapture(e.pointerId);vp.classList.add('dragging')});
vp.addEventListener('pointermove',e=>{if(!dragging)return;vp.scrollLeft-=e.clientX-lx;vp.scrollTop-=e.clientY-ly;lx=e.clientX;ly=e.clientY});
vp.addEventListener('pointerup',()=>{dragging=false;vp.classList.remove('dragging')});
function animate(){anim+=.018;document.querySelectorAll('.link.done').forEach((l,i)=>{l.style.opacity=.65+.35*Math.sin(anim*4+i)});raf=requestAnimationFrame(animate)}
/* ============================================================
   ASSESSMENT ENGINE
   ============================================================ */

let assessmentModule = null;
let assessmentQuestion = 0;
let assessmentAnswers = [];
let assessmentResult = null;

const assessmentOverlay = document.getElementById("assessmentOverlay");
const assessmentBody = document.getElementById("assessmentBody");
const assessmentNext = document.getElementById("assessmentNext");

function resetAssessmentBody(){
    /* Rebuild the question UI every time an assessment starts.
       This is important because submitAssessment() replaces the
       body with the congratulations/failure screen. */
    assessmentBody.innerHTML = `
        <div class="question-number" id="questionNumber">QUESTION 1</div>
        <div class="question-text" id="questionText">Question goes here</div>
        <div id="answerOptions"></div>
    `;
}

function startAssessment(moduleId){
    const assessment = assessments[moduleId];
    const module = byId[moduleId];

    if(!assessment || !module){
        alert("Assessment has not been created for this module yet.");
        return;
    }

    /* Always start a completely fresh assessment for the module clicked. */
    assessmentModule = moduleId;
    assessmentQuestion = 0;
    assessmentAnswers = [];
    assessmentResult = null;

    resetAssessmentBody();

    assessmentOverlay.classList.add("open");
    renderAssessmentQuestion();
}

function renderAssessmentQuestion(){
    const assessment = assessments[assessmentModule];
    const module = byId[assessmentModule];

    if(!assessment || !module) return;

    /* Make sure the question elements exist. */
    if(!document.getElementById("questionText")){
        resetAssessmentBody();
    }

    const question = assessment.questions[assessmentQuestion];

    document.getElementById("assessmentCode").textContent = module.code;
    document.getElementById("assessmentTitle").textContent =
        module.name + " Assessment";

    document.getElementById("assessmentProgress").textContent =
        "Question " + (assessmentQuestion + 1) +
        " / " + assessment.questions.length;

    document.getElementById("questionNumber").textContent =
        "QUESTION " + (assessmentQuestion + 1);

    document.getElementById("questionText").textContent =
        question.question;

    const options = document.getElementById("answerOptions");
    options.innerHTML = "";

    question.options.forEach((option,index)=>{
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer-option";
        button.textContent =
            String.fromCharCode(65 + index) + ". " + option;

        if(assessmentAnswers[assessmentQuestion] === index){
            button.classList.add("selected");
        }

        button.addEventListener("click",()=>{
            assessmentAnswers[assessmentQuestion] = index;
            options.querySelectorAll(".answer-option")
                .forEach(x=>x.classList.remove("selected"));
            button.classList.add("selected");
        });

        options.appendChild(button);
    });

    assessmentNext.dataset.mode = "question";
    assessmentNext.textContent =
        assessmentQuestion === assessment.questions.length - 1
            ? "SUBMIT ASSESSMENT"
            : "NEXT QUESTION";
}

/* ONE handler only. Its behavior is determined by data-mode. */
assessmentNext.addEventListener("click",()=>{
    const mode = assessmentNext.dataset.mode;

    if(mode === "complete"){
        completeModuleAfterAssessment();
        return;
    }

    if(mode === "retry"){
        startAssessment(assessmentModule);
        return;
    }

    const assessment = assessments[assessmentModule];
    if(!assessment) return;

    if(assessmentAnswers[assessmentQuestion] === undefined){
        alert("Please select an answer first.");
        return;
    }

    if(assessmentQuestion < assessment.questions.length - 1){
        assessmentQuestion++;
        renderAssessmentQuestion();
    }else{
        submitAssessment();
    }
});

function submitAssessment(){
    const assessment = assessments[assessmentModule];
    const module = byId[assessmentModule];

    if(!assessment || !module) return;

    let correct = 0;

    assessment.questions.forEach((question,index)=>{
        if(assessmentAnswers[index] === question.answer){
            correct++;
        }
    });

    const score = Math.round(
        (correct / assessment.questions.length) * 100
    );

    const passed = score >= assessment.passScore;
    assessmentResult = passed;

    if(passed){
        assessmentBody.innerHTML = `
            <div class="assessment-result">
                <div style="font-size:50px">🎉</div>
                <div class="assessment-score">${score}%</div>
                <h2>Assessment Passed</h2>
                <div class="assessment-message">
                    You passed the <strong>${module.name}</strong> assessment.
                    <br><br>
                    Complete this module to unlock the next skill.
                </div>
                <div class="assessment-result-actions">
                    <button type="button" class="secondary-action" id="retakeAssessment">
                        ↻ RETAKE ASSESSMENT
                    </button>
                </div>
            </div>`;

        assessmentNext.dataset.mode = "complete";
        assessmentNext.textContent = "COMPLETE MODULE";

        document.getElementById("retakeAssessment")
            .addEventListener("click",()=>{
                startAssessment(assessmentModule);
            });

    }else{
        assessmentBody.innerHTML = `
            <div class="assessment-result assessment-failed">
                <div style="font-size:50px">📚</div>
                <div class="assessment-score">${score}%</div>
                <h2>Assessment Not Passed</h2>
                <div class="assessment-message">
                    You need at least ${assessment.passScore}% to complete this module.
                    <br><br>
                    Review Microsoft Learn and try again.
                </div>
            </div>`;

        assessmentNext.dataset.mode = "retry";
        assessmentNext.textContent = "TRY AGAIN";
    }
}

function completeModuleAfterAssessment(){
    if(!assessmentModule) return;

    const completedModule = assessmentModule;

    /* Only a passed assessment can reach this function. */
    if(assessmentResult !== true) return;

    state[completedModule] = true;

    assessmentOverlay.classList.remove("open");

    /* Select the module that was actually completed. */
    selected = completedModule;

    /* Clear assessment state so the next module starts fresh. */
    assessmentModule = null;
    assessmentQuestion = 0;
    assessmentAnswers = [];
    assessmentResult = null;

    draw();
}

document.getElementById("assessmentCancel").addEventListener("click",()=>{
    assessmentOverlay.classList.remove("open");

    assessmentModule = null;
    assessmentQuestion = 0;
    assessmentAnswers = [];
    assessmentResult = null;
});

draw();animate();
</script>
</body>
</html>
